server {
    listen 80;
    server_name alexismoralesgomez.com www.alexismoralesgomez.com;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión: el JS de Three.js pasa de ~920 kB a ~245 kB
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché básico para archivos estáticos generados por Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}