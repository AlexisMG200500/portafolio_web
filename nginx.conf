server {
    listen 80;
    server_name alexismoralesgomez.com www.alexismoralesgomez.com;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché básico para archivos estáticos generados por Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}